<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUK IT Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body class="admin"><header class="admin-head"><a class="brand" href="index.html">PUK<span> IT</span></a><div><button id="change-password" hidden>เปลี่ยนรหัสผ่าน</button> <button id="logout" hidden>ออกจากระบบ</button></div></header><main class="admin-main"><section id="login"><p class="eyebrow">ADMIN AREA</p><h1>เข้าสู่ระบบ<br><i>จัดการเว็บไซต์</i></h1><form id="login-form" class="panel"><label>อีเมล<input required type="email" name="email"></label><label>รหัสผ่าน<input required type="password" name="password"></label><button class="button">เข้าสู่ระบบ</button><p class="status"></p></form></section><section id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">PUK IT ADMIN</p><h1>จัดการ <i>เว็บไซต์</i></h1></div><a class="button small" href="index.html">ดูหน้าเว็บ ↗</a></div><nav class="tabs"><button class="active" data-tab="projects">ผลงาน</button><button data-tab="services">บริการ</button><button data-tab="leads">รายการลูกค้า</button><button data-tab="settings">ข้อความหน้าเว็บ</button></nav><section class="panel"><div class="panel-head"><h2 id="panel-title">ผลงานที่ดูแล</h2><button class="button small" id="new-item">+ เพิ่มรายการ</button></div><div id="admin-content"></div></section></section></main><dialog id="password-editor"><form method="dialog" id="password-form"><h2>เปลี่ยนรหัสผ่าน</h2><p class="muted">สำหรับบัญชีที่กำลังล็อกอินอยู่</p><label>รหัสผ่านเดิม<input required type="password" name="current_password" autocomplete="current-password"></label><label>รหัสผ่านใหม่<input required type="password" name="new_password" minlength="12" autocomplete="new-password"></label><label>ยืนยันรหัสผ่านใหม่<input required type="password" name="confirm_password" minlength="12" autocomplete="new-password"></label><p class="status" id="password-status"></p><div class="dialog-actions"><button value="cancel">ยกเลิก</button><button class="button" value="save">บันทึกรหัสผ่านใหม่</button></div></form></dialog><dialog id="editor"><form method="dialog" id="edit-form"><h2 id="editor-title">แก้ไขรายการ</h2><input type="hidden" name="id"><label>ชื่อรายการ<input required name="title"></label><label>รายละเอียด<textarea required name="description"></textarea></label><label class="project-only">หมวดงาน<input name="category" placeholder="เช่น เดินสาย LAN · ติดตั้งตู้ Rack"></label><label class="project-only">ลิงก์รูปภาพ (ถ้ามี)<input name="image_url" placeholder="https://..."></label><label><input type="checkbox" name="is_published" checked> แสดงบนเว็บไซต์</label><div class="dialog-actions"><button value="cancel">ยกเลิก</button><button class="button" value="save">บันทึก</button></div></form></dialog><script type="module" src="js/admin.js?v=103"></script></body></html>
