<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PUK IT — ทดลองระบบหลังบ้าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#20201e;--paper:#f7f5f0;--line:#ddd7cc;--orange:#ed714b;--muted:#746e65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Thai",sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--ink);color:#fff;padding:28px 18px}.brand{font:700 28px "DM Sans";letter-spacing:-1.5px;margin:0 10px 48px}.brand span{color:var(--orange)}.side p{color:#aaa;font:600 10px "DM Sans";letter-spacing:1px;margin:0 10px 10px}.side button{display:block;width:100%;border:0;background:transparent;color:#eee;text-align:left;padding:11px 10px;border-radius:7px;font:600 14px "Noto Sans Thai";cursor:pointer}.side button.active,.side button:hover{background:#3a3936}.side small{display:block;margin:32px 10px;color:#bbb;line-height:1.6}.main{width:min(100% - 48px,1020px);margin:0 auto;padding:50px 0}.notice{background:#fff0e9;border-left:4px solid var(--orange);padding:12px 15px;font-size:13px;margin-bottom:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font:700 11px "DM Sans";color:var(--muted);letter-spacing:1.2px;margin:0 0 10px}.eyebrow:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:7px}h1{font:700 42px/1.25 "Noto Sans Thai";letter-spacing:-1px;margin:0}.button{border:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:5px;font:700 13px "Noto Sans Thai";cursor:pointer}.button:hover{background:var(--orange)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 13px;font:700 13px "Noto Sans Thai";cursor:pointer}.tabs button.active{background:var(--ink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.panel h2{margin:0;font-size:20px}.row{display:grid;grid-template-columns:1.4fr 1.5fr .7fr auto;align-items:center;gap:14px;border-top:1px solid #eee;padding:14px 0;font-size:13px}.row b{display:block}.muted{color:var(--muted);font-size:12px}.tag{background:#e1f1de;color:#2f6737;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.edit{border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 8px;font:600 12px "Noto Sans Thai";cursor:pointer}.edit:hover{border-color:var(--ink)}dialog{border:0;border-radius:10px;width:min(510px,calc(100% - 32px));box-shadow:0 16px 50px #0004}dialog::backdrop{background:#0008}dialog h2{margin:0 0 18px}label{display:block;font-size:13px;font-weight:700;margin:13px 0}input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;font:14px "Noto Sans Thai"}textarea{height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.cancel{border:1px solid var(--line);background:#fff;border-radius:5px;padding:10px 14px;cursor:pointer}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:none}.main{width:calc(100% - 32px);padding:30px 0}.top{align-items:start}.row{grid-template-columns:1fr;gap:5px}}
  </style>
</head>
<body>
  <div class="layout"><aside class="side"><div class="brand">PUK<span> IT</span></div><p>โหมดทดลอง</p><button class="active" data-tab="projects">ผลงานที่ดูแล</button><button data-tab="services">บริการ</button><button data-tab="content">ข้อความหน้าเว็บ</button><button data-tab="leads">รายการลูกค้า</button><small>ข้อมูลในหน้านี้เก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น<br>ไม่เชื่อม Supabase และไม่ใช่หน้าใช้งานจริง</small></aside><main class="main"><div class="notice">โหมดทดลอง: ลองเพิ่มและแก้ไขได้ทันที ข้อมูลจะอยู่ในเครื่องนี้จนกว่าจะกด “คืนค่าตัวอย่าง”</div><div class="top"><div><p class="eyebrow">PUK IT DEMO</p><h1 id="title">ผลงานที่ดูแล</h1></div><button class="button" id="add">+ เพิ่มรายการ</button></div><div class="tabs" id="mobile-tabs"></div><section class="panel"><div class="panel-head"><h2 id="subtitle">รายการผลงาน</h2><button class="edit" id="reset">คืนค่าตัวอย่าง</button></div><div id="list"></div></section></main></div>
  <dialog id="dialog"><form id="form"><h2 id="dialog-title">แก้ไขรายการ</h2><input name="id" type="hidden"><label>ชื่อรายการ<input required name="name"></label><label>รายละเอียด<textarea required name="detail"></textarea></label><div class="actions"><button class="cancel" type="button" id="cancel">ยกเลิก</button><button class="button">บันทึก</button></div></form></dialog>
  <script>
    const defaults={projects:[['สำนักงาน 40 จุดใช้งาน','เดินสาย LAN · ติดตั้งตู้ Rack'],['ร้านกาแฟและพื้นที่ลูกค้า','Site survey · Wi-Fi setup'],['ระบบ Server และ Backup','Monitoring · Data backup']],services:[['ดูแลระบบ IT','คอมพิวเตอร์ · โปรแกรม · อุปกรณ์สำนักงาน'],['เดินสาย LAN & Network','เดินสาย · ตู้ Rack · ระบบเครือข่าย'],['ติดตั้ง Wi-Fi','สำรวจพื้นที่ · จุดกระจายสัญญาณ'],['Server & Backup','ดูแล · ตรวจสอบ · สำรองข้อมูล']],content:[['ข้อความหน้าแรก','ระบบไอทีที่พร้อม ให้ธุรกิจคุณเดินหน้า'],['เกี่ยวกับ PUK IT','ไอทีที่คุณเรียกหาได้จริง'],['ข้อมูลติดต่อ','LINE: petsut123 · Email: pukzone@hotmail.com']],leads:[['สมชาย ใจดี','ต้องการติดตั้ง Wi-Fi · รอติดต่อ'],['บริษัท สยามเทรด','เดินสาย LAN สำนักงาน · รอติดต่อ'],['คุณแอน','ดูแล Server รายเดือน · ติดต่อแล้ว']]};
    const labels={projects:['ผลงานที่ดูแล','รายการผลงาน'],services:['บริการ','รายการบริการ'],content:['ข้อความหน้าเว็บ','ส่วนของหน้าเว็บไซต์'],leads:['รายการลูกค้า','คำขอจากเว็บไซต์']};let data=JSON.parse(localStorage.getItem('puk-it-demo')||'null')||structuredClone(defaults),tab='projects',editing=-1;
    const $=s=>document.querySelector(s),save=()=>localStorage.setItem('puk-it-demo',JSON.stringify(data));
    function render(){ $('#title').textContent=labels[tab][0];$('#subtitle').textContent=labels[tab][1];$('#add').hidden=tab==='leads';$('#list').innerHTML=data[tab].map((x,i)=>`<div class="row"><div><b>${safe(x[0])}</b><span class="muted">${safe(x[1])}</span></div><div class="muted">${tab==='leads'?'ส่งจากแบบฟอร์ม':'แสดงบนเว็บไซต์'}</div><span class="tag">${tab==='leads'?'ใหม่':'แสดงอยู่'}</span><button class="edit" data-edit="${i}">${tab==='leads'?'ดูข้อมูล':'แก้ไข'}</button></div>`).join('');}
    function safe(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function open(i=-1){editing=i;$('#dialog-title').textContent=i<0?'เพิ่มรายการ':'แก้ไขรายการ';$('#form').reset();if(i>=0){$('#form').name.value=data[tab][i][0];$('#form').detail.value=data[tab][i][1];}$('#dialog').showModal();}
    document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));render();});$('#add').onclick=()=>open();$('#list').onclick=e=>{const b=e.target.closest('[data-edit]');if(b)open(+b.dataset.edit)};$('#cancel').onclick=()=>$('#dialog').close();$('#form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),row=[f.get('name').trim(),f.get('detail').trim()];if(editing<0)data[tab].push(row);else data[tab][editing]=row;save();$('#dialog').close();render();};$('#reset').onclick=()=>{if(confirm('คืนค่าข้อมูลตัวอย่างหรือไม่?')){data=structuredClone(defaults);save();render();}};render();
  </script>
</body></html>
